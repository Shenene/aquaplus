name: AQUA+ CD

on:
  workflow_run:
    workflows: ['AQUA\+ CI']
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aquaplus-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AQUA+ to AWS
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set unique Elastic Beanstalk version
        run: |
          echo "EB_VERSION_LABEL=aquaplus-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build AQUA+ Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Push AQUA+ image to Docker Hub
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:latest"

      - name: Create Elastic Beanstalk deployment bundle
        run: |
          mkdir -p deployment

          cat > deployment/Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$IMAGE_NAME:$IMAGE_TAG",
              "Update": "true"
            },
            "Ports": [
              {
                "ContainerPort": "3000"
              }
            ]
          }
          EOF

          cd deployment
          zip "../$EB_VERSION_LABEL.zip" Dockerrun.aws.json

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get Elastic Beanstalk deployment bucket
        run: |
          S3_BUCKET=$(aws elasticbeanstalk create-storage-location \
            --region "$AWS_REGION" \
            --query S3Bucket \
            --output text)

          echo "S3_BUCKET=$S3_BUCKET" >> "$GITHUB_ENV"

      - name: Upload deployment bundle to S3
        run: |
          aws s3 cp \
            "$EB_VERSION_LABEL.zip" \
            "s3://$S3_BUCKET/aquaplus/$EB_VERSION_LABEL.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$EB_VERSION_LABEL" \
            --source-bundle S3Bucket="$S3_BUCKET",S3Key="aquaplus/$EB_VERSION_LABEL.zip" \
            --region "$AWS_REGION"

      - name: Deploy application version
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$EB_VERSION_LABEL" \
            --region "$AWS_REGION"

      - name: Wait for Elastic Beanstalk update
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION"

      - name: Verify deployed version and environment health
        run: |
          echo "Expected Elastic Beanstalk version: $EB_VERSION_LABEL"

          for ATTEMPT in {1..24}; do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query "Environments[0].Status" \
              --output text)

            RUNNING_VERSION=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query "Environments[0].VersionLabel" \
              --output text)

            HEALTH_STATUS=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query "Environments[0].HealthStatus" \
              --output text)

            HEALTH_COLOR=$(aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query "Environments[0].Health" \
              --output text)

            echo "Check $ATTEMPT/24: Status=$STATUS | Version=$RUNNING_VERSION | HealthStatus=$HEALTH_STATUS | Health=$HEALTH_COLOR"

            if [ "$STATUS" = "Ready" ] && \
               [ "$RUNNING_VERSION" = "$EB_VERSION_LABEL" ] && \
               [ "$HEALTH_STATUS" = "Ok" ]; then
              echo "AQUA+ deployment verified successfully."
              exit 0
            fi

            if [ "$STATUS" = "Ready" ] && \
               [ "$RUNNING_VERSION" != "$EB_VERSION_LABEL" ]; then
              echo "::error::Elastic Beanstalk is Ready but is not running the expected application version."

              aws elasticbeanstalk describe-events \
                --environment-name "$EB_ENVIRONMENT_NAME" \
                --region "$AWS_REGION" \
                --max-records 10 \
                --query "Events[].[EventDate,Severity,Message]" \
                --output table

              exit 1
            fi

            sleep 10
          done

          echo "::error::AQUA+ did not reach healthy production status within the verification period."

          aws elasticbeanstalk describe-environment-health \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --attribute-names All \
            --region "$AWS_REGION" \
            --output table || true

          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION" \
            --max-records 10 \
            --query "Events[].[EventDate,Severity,Message]" \
            --output table || true

          exit 1

      - name: Show deployment result
        run: |
          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION" \
            --query "Environments[0].{Status:Status,Health:Health,HealthStatus:HealthStatus,Version:VersionLabel,CNAME:CNAME}" \
            --output table
